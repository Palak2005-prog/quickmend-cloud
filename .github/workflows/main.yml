
name: Deploy QuickMend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload website build to S3
        run: |
          aws s3 sync dist/ s3://quickmend-storage-palak-2026/deploy/ --delete

      - name: Deploy website through Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0aad0d89b57cec783 \
            --document-name AWS-RunShellScript \
            --comment "Deploy QuickMend website" \
            --parameters '{"commands":["set -e","sudo rm -rf /tmp/quickmend-dist","sudo mkdir -p /tmp/quickmend-dist","aws s3 sync s3://quickmend-storage-palak-2026/deploy/ /tmp/quickmend-dist/ --delete","sudo rsync -av --delete /tmp/quickmend-dist/ /var/www/html/","sudo chown -R www-data:www-data /var/www/html","sudo systemctl reload nginx"]}' \
            --query "Command.CommandId" \
            --output text) 

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0aad0d89b57cec783

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0aad0d89b57cec783 \
            --query "Status" \
            --output text)

          echo "EC2 deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0aad0d89b57cec783 \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
