name: Deploy QuickMend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/quickmend_key"
          chmod 600 "$HOME/.ssh/quickmend_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/quickmend_key" \
            dist/ "$EC2_USER@$EC2_HOST:/tmp/quickmend-dist/"

          ssh -i ~/.ssh/quickmend_key "$EC2_USER@$EC2_HOST" \
            "sudo rsync -av --delete /tmp/quickmend-dist/ /var/www/html/"
