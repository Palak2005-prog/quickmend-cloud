
name: Deploy QuickMend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          echo "Step 1: Create SSH directory"
          mkdir -p "$HOME/.ssh" || exit 11

          echo "Step 2: Check host secret"
          test -n "$EC2_HOST" || exit 12

          echo "Step 3: Check private key secret"
          test -n "$EC2_SSH_KEY" || exit 13

          echo "Step 4: Write private key"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/quickmend_key" || exit 14

          echo "Step 5: Set key permissions"
          chmod 600 "$HOME/.ssh/quickmend_key" || exit 15

          echo "Step 6: Scan EC2 host key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts" || exit 16

          echo "SSH setup completed"

      - name: Deploy website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/quickmend_key" \
            dist/ "$EC2_USER@$EC2_HOST:/tmp/quickmend-dist/"
          ssh -i "$HOME/.ssh/quickmend_key" "$EC2_USER@$EC2_HOST" \
            "sudo mkdir -p /var/www/html && sudo rsync -av --delete /tmp/quickmend-dist/ /var/www/html/ && sudo chown -R www-data:www-data /var/www/html"
